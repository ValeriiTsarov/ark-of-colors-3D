    <script>
        // Boot error catcher: show errors on screen (mobile has no console). Watchdog: main.ts sets __booted.
        (function () {
            function show(msg) {
                if (window.__portal) return;   // a portal's ad scripts fail and reject on their own; players must not see that
                var d = document.getElementById('boot-err');
                if (!d) {
                    d = document.createElement('div');
                    d.id = 'boot-err';
                    d.style.cssText = 'position:fixed;left:0;right:0;top:0;padding:12px;background:#a00;color:#fff;font:14px monospace;white-space:pre-wrap;z-index:9999';
                    (document.body || document.documentElement).appendChild(d);
                }
                d.textContent += msg + '\n';
            }
            window.onerror = function (m, src, line) { show('Error: ' + m + ' (' + src + ':' + line + ')'); };
            // Capture phase: resource load errors (<script>/<img>) don't bubble and never reach onerror.
            window.addEventListener('error', function (e) {
                var t = e.target;
                if (t && t !== window && (t.src || t.href)) show('Failed to load: ' + (t.src || t.href));
            }, true);
            window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
            setTimeout(function () { if (!window.__booted) show('Game did not start in 8 s. Try reloading.'); }, 8000);
            // Space, arrows and the wheel must not scroll a portal host page: scrolling chains out of the iframe.
            window.addEventListener('keydown', function (e) {
                if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
            });
            window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
        })();
    </script>
